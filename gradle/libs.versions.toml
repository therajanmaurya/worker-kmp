[versions]
kotlin = "2.4.20"
compose-multiplatform = "1.12.0"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.11.0"
agp = "9.4.0"
android-minSdk = "24"
android-compileSdk = "37"
android-targetSdk = "37"
junit = "4.13.2"
kermit = "2.2.0"
bcv = "0.18.2"
dokka = "2.2.0"
koin = "4.2.2"
spotless = "8.10.2"
detekt = "1.23.8"
kover = "0.9.9"
ktlint = "1.8.0"
vanniktech-publish = "0.37.0"
# Store5 — Mobile Native Foundation's KMP store/cache library.
# 5.1.0-beta01 is the latest published version on Maven Central as of 2026-09-16;
# 5.0.0 GA lacks wasmJs targets so we track the 5.1.0 pre-release line which matches
# our full KMP target matrix (jvm + iosArm64 + iosSimulatorArm64 + iosX64 + js + wasmJs).
store5 = "5.1.0-beta01"
# KSP2 — Kotlin Symbol Processing — tracks Kotlin major.minor, decoupled patch.
# 2.3.12 is the newest published KSP (2026-09-09); there is no 2.4.x line yet, and the old
# KSP1 `<kotlin>-<ksp>` scheme (last: 2.2.21-2.0.5) is retired — don't reach for a
# `2.4.20-1.0.x`, it does not exist on Central or the plugin portal.
# This does NOT pin the kotlin version above: KSP2 is decoupled from the exact compiler.
# Verified 2026-09-16 — kotlin 2.4.20 + ksp 2.3.12 runs a real processor to completion,
# though KSP 2.3.12 still only *targets* the 2.3 line (its POM binds kotlin-stdlib 2.3.20).
ksp = "2.3.12"
gradle-plugin-publish = "2.2.1"
# kotlin-compile-testing for KSP processor functional tests
kct-ksp = "0.14.0"
roborazzi = "1.74.0"
robolectric = "4.17"
androidx-work-testing = "2.11.2"
androidx-test-core = "1.7.0"

